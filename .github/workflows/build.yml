name: Build & Release GestRes Pro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: GestRes-Pro-Windows.exe
            pyinstaller_args: --onefile --windowed --name GestRes-Pro
          - os: macos-latest
            artifact: GestRes-Pro-macOS
            pyinstaller_args: --onefile --windowed --name GestRes-Pro
          - os: ubuntu-latest
            artifact: GestRes-Pro-Linux
            pyinstaller_args: --onefile --name GestRes-Pro

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Linux display dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Build executable
        run: pyinstaller ${{ matrix.pyinstaller_args }} main.py

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: mv dist/GestRes-Pro.exe dist/${{ matrix.artifact }}
        shell: bash

      - name: Rename artifact (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: mv dist/GestRes-Pro dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: GestRes Pro ${{ github.ref_name }}
          body: |
            ## Télécharger GestRes Pro

            Choisissez la version correspondant à votre système :

            | Système | Fichier |
            |---------|---------|
            | Windows | `GestRes-Pro-Windows.exe` |
            | macOS   | `GestRes-Pro-macOS` |
            | Linux   | `GestRes-Pro-Linux` |

            ### Installation
            1. Téléchargez le fichier pour votre OS
            2. Double-cliquez pour lancer l'application (aucune installation Python requise)
            3. Identifiants de démonstration : voir le README
          files: artifacts/**/*
